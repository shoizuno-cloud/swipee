<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>try{var t=localStorage.getItem('theme');if(t&&t!=='system')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<title>Swipee</title>
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0f0f14">
<link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Swipee"><link rel="stylesheet" href="/style.css"></head>
<body>
<select id="langSel" aria-label="Language"></select>
<div id="login" class="screen hidden">
  <h1>🎧 Swipee</h1>
  <p data-i18n="tagline">サビだけ聴いて、好きな曲に出会う。<br>友達が今聴いている曲も見れる。</p>
  <a id="spLogin" class="btn green" href="/auth/login" data-i18n="spotifyStart">Spotifyで始める</a>
  <div class="or" data-i18n="orTry">または(Spotify連携なしで試す)</div>
  <form id="demoForm"><input id="name" data-i18n-ph="nickname" placeholder="ニックネーム" maxlength="20"><button class="btn" data-i18n="start">はじめる</button></form>
</div>
<div id="app" class="hidden">
  <header><b>🎧 Swipee</b><span id="who"></span></header>
  <main>
    <section id="tab-discover">
      <div class="filters"><select id="genre"></select><input id="q" data-i18n-ph="searchPh" placeholder="アーティスト・曲名で探す"></div>
      <div id="card"></div>
      <div class="actions"><button id="undo" class="round sm">↩</button><button id="skip" class="round">✕</button><button id="pause" class="round sm">⏸</button><button id="replay" class="round sm">↺</button><button id="like" class="round pink">♥</button></div>
      <p class="hint" data-i18n="discoverHint">← スキップ / → いいね / スペース 再生・停止 (30秒プレビュー=サビ付近)</p>
    </section>
    <section id="tab-library" class="hidden"></section>
    <section id="tab-friends" class="hidden"></section>
    <section id="tab-settings" class="hidden"></section>
  </main>
  <nav><button data-tab="discover" class="on" data-i18n="navDiscover">発見</button><button data-tab="library" data-i18n="navLibrary">ライブラリ</button><button data-tab="friends" data-i18n="navFriends">友達</button><button data-tab="settings" data-i18n="navSettings">設定</button></nav>
</div>
<audio id="audio"></audio><div id="toast"></div>
<script src="/app.js"></script></body></html>
